<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BishopTech Apple-native agentic engineering team map</title>
  <desc id="desc">A project brief enters an Apple engineering orchestrator and flows through architecture, native design, on-device AI, implementation, testing, release, and source maintenance roles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102640"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fffe0"/>
      <stop offset="1" stop-color="#65b8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9fffe0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1430" cy="100" r="260" fill="#65b8ff" opacity="0.08"/>
  <circle cx="190" cy="780" r="300" fill="#9fffe0" opacity="0.06"/>

  <text x="100" y="105" fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BISHPOTECH IOS 26 SKILLS LAB</text>
  <text x="100" y="175" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">An Apple-native engineering team for LLMs</text>
  <text x="100" y="220" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="23">Source-grounded routes • Liquid Glass • on-device AI • testing • release proof</text>

  <g filter="url(#shadow)">
    <rect x="100" y="350" width="240" height="120" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="220" y="397" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">APP BRIEF</text>
    <text x="220" y="432" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="18">idea • constraints • risk</text>

    <rect x="470" y="300" width="310" height="220" rx="34" fill="url(#glass)" stroke="url(#accent)" stroke-width="2"/>
    <text x="625" y="370" text-anchor="middle" fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ORCHESTRATOR</text>
    <text x="625" y="417" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Apple route</text>
    <text x="625" y="458" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="18">sources • gates • handoffs</text>
    <text x="625" y="489" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="18">evidence • uncertainty</text>
  </g>

  <path d="M340 410 C390 410 410 410 465 410" fill="none" stroke="#9fffe0" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="920" y="280" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1055" y="321" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ARCHITECTURE</text>
    <text x="1055" y="351" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">SDK • target • modules</text>

    <rect x="1225" y="280" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1360" y="321" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">NATIVE DESIGN</text>
    <text x="1360" y="351" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">SwiftUI • glass • a11y</text>

    <rect x="920" y="425" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1055" y="466" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">ON-DEVICE AI</text>
    <text x="1055" y="496" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">typed • private • reviewable</text>

    <rect x="1225" y="425" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1360" y="466" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">IMPLEMENTATION</text>
    <text x="1360" y="496" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">Swift • data • concurrency</text>

    <rect x="920" y="570" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1055" y="611" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">TEST + AUDIT</text>
    <text x="1055" y="641" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">fixtures • UI • device • a11y</text>

    <rect x="1225" y="570" width="270" height="100" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="1360" y="611" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">RELEASE</text>
    <text x="1360" y="641" text-anchor="middle" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="17">privacy • signing • TestFlight</text>
  </g>

  <path d="M780 350 C835 330 855 330 915 330" fill="none" stroke="#9fffe0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 390 C840 390 860 475 915 475" fill="none" stroke="#9fffe0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 435 C840 455 860 620 915 620" fill="none" stroke="#9fffe0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 365 C890 375 1080 390 1215 330" fill="none" stroke="#65b8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 430 C900 505 1080 500 1215 475" fill="none" stroke="#65b8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 475 C920 570 1090 630 1215 620" fill="none" stroke="#65b8ff" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="100" y="790" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Evidence is a handoff, not a vibe.</text>
  <text x="100" y="830" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="20">Source → target → compile → fixture → UI → device → signed release → production</text>
  <text x="1495" y="830" text-anchor="end" fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">19 ROLE PACKAGES</text>
</svg>
