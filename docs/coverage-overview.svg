<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">BishopTech iOS 26 Skills Lab coverage overview</title>
  <desc id="desc">A dark chart showing 1,007 source-linked Markdown files, 976 content pages, 3,081 official Apple and Swift destinations, 19 role packages, and 19 portable skill artifacts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#102640"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fffe0"/>
      <stop offset="1" stop-color="#65b8ff"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65b8ff"/>
      <stop offset="1" stop-color="#5278ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#background)"/>
  <circle cx="1440" cy="80" r="230" fill="#65b8ff" opacity="0.08"/>
  <circle cx="160" cy="690" r="240" fill="#9fffe0" opacity="0.06"/>

  <text x="88" y="88" fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">VERIFIED REPOSITORY SIGNALS</text>
  <text x="88" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">A knowledge base built for routes, not vibes.</text>
  <text x="88" y="184" fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="20">Counts are paired with source links, package contracts, and evidence gates.</text>

  <g opacity="0.2" stroke="#b8c8da" stroke-width="1">
    <line x1="120" y1="568" x2="900" y2="568"/>
    <line x1="120" y1="470" x2="900" y2="470"/>
    <line x1="120" y1="372" x2="900" y2="372"/>
    <line x1="120" y1="274" x2="900" y2="274"/>
  </g>
  <g fill="#8fa5bd" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">
    <text x="105" y="573">0</text>
    <text x="105" y="475">1,000</text>
    <text x="105" y="377">2,000</text>
    <text x="105" y="279">3,000</text>
  </g>
  <line x1="120" y1="568" x2="900" y2="568" stroke="#8fa5bd" stroke-opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="190" y="469" width="148" height="99" rx="18" fill="url(#bar)"/>
    <rect x="430" y="472" width="148" height="96" rx="18" fill="url(#barBlue)"/>
    <rect x="670" y="266" width="148" height="302" rx="18" fill="url(#bar)"/>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="264" y="445" font-size="30" font-weight="700">1,007</text>
    <text x="504" y="448" font-size="30" font-weight="700">976</text>
    <text x="744" y="242" font-size="30" font-weight="700">3,081</text>
  </g>
  <g fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="264" y="604">SOURCE-LINKED</text>
    <text x="264" y="626">MARKDOWN FILES</text>
    <text x="504" y="604">CONTENT</text>
    <text x="504" y="626">PAGES</text>
    <text x="744" y="604">OFFICIAL APPLE /</text>
    <text x="744" y="626">SWIFT DESTINATIONS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="246" width="480" height="322" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <line x1="1052" y1="355" x2="1448" y2="355" stroke="#ffffff" stroke-opacity="0.14"/>
    <line x1="1250" y1="286" x2="1250" y2="528" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <g fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">
    <text x="1052" y="294">PORTABLE TEAM</text>
    <text x="1052" y="399">QUALITY SIGNAL</text>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
    <text x="1052" y="342" font-size="44" font-weight="700">19</text>
    <text x="1284" y="342" font-size="44" font-weight="700">19</text>
    <text x="1052" y="449" font-size="36" font-weight="700">Source → device</text>
    <text x="1052" y="484" fill="#b8c8da" font-size="18">A handoff contract follows each role</text>
    <text x="1052" y="514" fill="#b8c8da" font-size="18">from official source to release proof.</text>
  </g>
  <g fill="#b8c8da" font-family="Arial, Helvetica, sans-serif" font-size="16">
    <text x="1052" y="390">ROLE PACKAGES</text>
    <text x="1284" y="390">SKILL ARTIFACTS</text>
  </g>

  <text x="88" y="681" fill="#9fffe0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">BishopTech iOS 26 Skills Lab</text>
  <text x="1512" y="681" fill="#8fa5bd" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end">SwiftUI • Liquid Glass • on-device AI • assurance</text>
</svg>
