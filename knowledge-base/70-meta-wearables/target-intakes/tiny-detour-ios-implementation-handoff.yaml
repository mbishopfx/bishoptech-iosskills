  - "Capture the phone, Meta AI, on-glasses DAT-app, firmware, runtime identity, and mode/channel tuple."
  - "Run named physical Display capability, camera, audio, input, disconnect, doff, and fallback tasks."
  - "Keep Gen 2 claims tied to the observed runtime tuple; Gen 3 mapping remains unresolved."
  - "Inspect signed identity/privacy metadata before any release-channel claim."

