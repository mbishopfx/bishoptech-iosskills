data_contract:
  processing_location: phone-local
  inputs:
    - user-started glasses camera frames through the DAT camera route
    - phone microphone only during an explicit answer step
    - optional user-consented HTTPS gateway request for redacted transient analysis
  network: "The local path remains useful without the gateway; any remote request is bounded, consented, HTTPS-only, and does not carry raw microphone audio."
  storage_retention: "Store bounded mission metadata and user outcomes locally; do not persist raw glasses frames or temporary audio buffers."
  consent_trigger: "The user starts the session, enables the selected capture/delivery preference, and separately consents before any gateway vision request."
  deletion: "Provide local history deletion; discard transient frames after processing and do not save raw audio."
  raw_data_boundary: "Raw camera/audio remain inside the active phone-owned processing path; shared state and display cards receive sanitized mission data only."

lifecycle:
  state_owner: TinyDetourHardwareModel
  session_epoch: "The hardware coordinator owns the active session/camera epoch and rejects stale display or camera events."
  stop_order: "Stop answer/audio observers and camera/display children before stopping and releasing the parent DeviceSession; clear wearable state before phone fallback."
  cancellation: "Cancel on user stop, background, doff, disconnect, denial, timeout, thermal/power degradation, and bounded queue failure."
  thermal_disconnect_doff: "Stop camera work, degrade to phone/audio/manual behavior, surface recovery, and require a fresh eligible session before restarting."

tests:
  reducer:
    - "Existing SideQuest capability-flow and state-transition tests"
    - "Existing local safety, fallback, retention, and response-boundary tests"
  mock_or_browser:
