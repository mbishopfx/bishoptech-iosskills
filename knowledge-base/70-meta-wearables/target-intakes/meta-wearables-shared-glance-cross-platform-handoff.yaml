data_contract:
  processing_location: mixed
  inputs:
    - "Sanitized product state from one selected native DAT Display or Web App adapter"
    - "Explicit user action from native Display input or Web App focus/pinch input"
    - "Phone-local setup, consent, and fallback state"
  network: "Native adapters use the phone companion transport; the Web App requires a public HTTPS origin; no remote processing is assumed by this packet."
  storage_retention: "Keep bounded outcome metadata only; do not persist raw camera frames, raw audio, browser payloads, device identifiers, or credentials in shared state."
  consent_trigger: "The user starts the outcome and explicitly accepts any capability-specific capture, network, or phone handoff before that adapter starts."
  deletion: "Discard transient adapter payloads at completion, cancellation, disconnect, doff, timeout, or fallback; expose deletion for any bounded phone history."
  raw_data_boundary: "Platform SDK objects, DOM events, raw media, transport payloads, and device identifiers remain inside their adapter; the shared reducer receives typed sanitized events only."

lifecycle:
  state_owner: "Shared outcome coordinator with one platform capability adapter and one monotonically increasing epoch"
  session_epoch: "Increment on registration, capability selection, cancellation, disconnect, host exit, and fallback; reject events from older epochs."
  stop_order: "Stop input/listeners and capability children first, clear or replace Display/Web content, then stop the parent DAT session or exit the Web App host, and finally return to the phone fallback."
  cancellation: "Cancel on user dismissal, permission denial, missing capability, stale event, host exit, timeout, disconnect, doff/fold, thermal/power degradation, queue pressure, or untrusted remote data."
  thermal_disconnect_doff: "Stop wearable work, preserve the phone outcome, surface a bounded recovery state, and require a fresh eligible target tuple before restart."

tests:
  reducer:
    - "Shared-domain Swift Testing suite: 4 tests passed in the static fixture receipt"
    - "Web App reducer suite: 5 tests passed with stale-event, focus, exit, timeout, and phone-fallback coverage"
  mock_or_browser:
    - "iOS DAT MockDevice and test-client starters type-check against the selected simulator XCFrameworks"
    - "Android target preflight passes static inventory; Android MockDevice compile remains not-run"
    - "Web App strict metadata/Node preflight passes; browser simulator remains not-run"
  build:
    - "iOS native Display/camera/MockDevice/test-client starters type-check; no shared cross-platform target build exists"
    - "Android Gradle/Maven compile not-run because the selected sibling target and Android build environment are absent"
  connected:
    - "Named iOS/Android/Web App registration, launch, capability, and input run not-run"
  physical:
    - "Named Ray-Ban Display, Gen 2, and alleged Gen 3 camera/audio/Display/input/recovery script not-run"
  signed_release:
    - "Signed artifacts, Developer Center release channels, tester accounts, App Store/Play review, and production delivery not-run"

open_gates:
  - "Create or identify one sibling project with separate iOS, Android, Web App, and shared-domain targets as needed."
  - "Select one primary surface for the first implementation and retain the other adapters as explicit follow-on routes."
  - "Run iOS target preflight, Android target preflight plus authenticated Maven resolution, or Web App origin preflight for the selected target."
  - "Capture the phone OS, Meta AI version, on-glasses DAT-app version, firmware, runtime identity, capability response, mode, and channel."
  - "Keep Meta Glasses product naming separate from the unresolved user shorthand Gen 3 until an official runtime mapping and named-device run exist."
  - "Execute connected and physical Display/input/fallback scripts before making a glasses-support claim."

next_proof_task: "PRE-TUPLE-01: choose the first sibling target and freeze its exact package/artifact/hosted revision, phone/companion/firmware/runtime tuple, processing location, and next connected proof task."
