schema_version: 1
manifest_id: meta-wearables-agent-team-2026-08-22
manifest_revision: 4
reviewed_at: "2026-08-30"
source_manifest_id: meta-wearables-public-surface-2026-08-22
source_manifest_revision: 6
authority_note: "This is the local orchestration contract. Official upstream role names and selected package/API sources remain authoritative; a roster entry never proves compilation, account access, physical behavior, or release approval."

source_ai_surfaces:
  root_files: [AGENTS.md, README.md, install-skills.sh]
  plugin_manifests:
    native-dat-ios: plugins/mwdat-ios/.codex-plugin/plugin.json
    native-dat-android: plugins/mwdat-android/.codex-plugin/plugin.json
    web-apps: plugins/meta-wearables-webapp/.codex-plugin/plugin.json
  docs_mcp_endpoint: https://mcp.developer.meta.com/wearables

agent_surface_contract:
  source_manifest_field: agent_surface_contract
  source_only: true
  docs_mcp_endpoint: https://mcp.developer.meta.com/wearables
  docs_mcp_authentication: none-per-official-repository-readmes
  docs_mcp_tools: [search_dat_docs, search_webapps_docs]
  local_callable_in_this_workspace: false
  expected_surface_ids: [native-dat-ios, native-dat-android, web-apps]
  route_rule: "Use official local Codex plugin installs for native DAT; use the Web Apps marketplace route; use MCP for live docs lookup only when the client exposes it, otherwise use the pinned repository/full-reference fallback."

surfaces:
  - id: native-dat-ios
    label: DAT iOS companion
    family: dat
    delivery: native-ios
    upstream_repository: https://github.com/facebook/meta-wearables-dat-ios
    upstream_plugin_root: plugins/mwdat-ios/skills
    local_primary_roles: [meta-dat-ios-integration, meta-dat-api-atlas, meta-dat-camera-audio, meta-dat-display]
  - id: native-dat-android
    label: DAT Android companion
    family: dat
    delivery: native-android
    upstream_repository: https://github.com/facebook/meta-wearables-dat-android
    upstream_plugin_root: plugins/mwdat-android/skills
    local_primary_roles: [meta-dat-android-integration, meta-dat-android-api-atlas]
  - id: web-apps
    label: Meta Wearables Web App on Ray-Ban Display
    family: webapps
    delivery: hosted-web-app
    upstream_repository: https://github.com/facebook/meta-wearables-webapp
    upstream_plugin_root: plugins/meta-wearables-webapp/skills
    local_primary_roles: [meta-wearables-web-apps, meta-wearables-input-sensors]
  - id: phone-fallback
    label: Phone-first fallback and consent/control plane
    family: product-architecture
    delivery: ios-android-web
    upstream_repository: https://wearables.developer.meta.com/llms.txt?full=true
    upstream_plugin_root: null
    local_primary_roles: [meta-wearables-app-architecture, meta-wearables-on-device-compliance]

