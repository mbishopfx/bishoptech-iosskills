device_claim_gates:
  - {id: ray-ban-display, required_manifest_term: ray-ban-display, minimum_evidence: physical, required_tasks: [DAT-DISP-01, WEB-PHYS-01], prohibited_shortcuts: [product-label-only, supportsDisplay-only, browser-simulator-only]}
  - {id: gen-2, required_manifest_term: gen-2, minimum_evidence: physical, required_tasks: [COMP-TUPLE-01, COMP-CAPABILITY-01, COMP-RELEASE-01], prohibited_shortcuts: [retail-label-only,-registration-only, neighboring-model-substitution]}
  - {id: gen-3, required_manifest_term: gen-3, minimum_evidence: physical, required_tasks: [COMP-GEN3-01, COMP-TUPLE-01, COMP-CAPABILITY-01], prohibited_shortcuts: [enum-alias, product-announcement-only, mock-only, browser-only]}

handoff_contract:
  required_fields: [outcome, selected_route, source_snapshot, target_tuple, selected_local_roles, upstream_role_handoffs, implementation_boundary, privacy_and_processing_contract, fallback, evidence_ledger, open_gates, next_proof_task]
  evidence_order: [source, access-gated, static, fixture, mock, build, browser-sim, connected, physical, signed, release-channel, production]
  non_claims: [source-is-not-build, mock-is-not-physical, browser-is-not-glasses, registration-is-not-capability, developer-mode-is-not-release, gen-label-is-not-runtime-mapping, attestation-is-not-local-processing]
  required_separation: [native-dat-ios, native-dat-android, web-apps, phone-fallback, glasses-native, phone-local, remote, mixed, unknown]

