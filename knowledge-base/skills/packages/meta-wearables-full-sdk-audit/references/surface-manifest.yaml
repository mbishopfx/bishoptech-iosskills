source_conflicts:
  - id: ios-minimum-and-module-names
    status: version-conflict
    action: "Use the selected 0.9.0 package/changelog and generated API; keep public-index wording as discovery only."
  - id: ios-dam-and-camera-lifecycle
    status: migration-conflict
    action: "Use 0.9.0 Camera ownership/stop and always-on DAM behavior; compile the target."
  - id: android-session-and-camera-names
    status: symbol-conflict
    action: "Resolve Session/DeviceSession and addCamera against the selected Maven artifact/API."
  - id: web-app-capability-index-versus-toolkit
    status: source-conflict
    action: "Keep text/offline/back/gesture/sensor features independent and to-verify until target evidence closes them."
  - id: android-wifi-parity
    status: platform-parity-conflict
    action: "Do not promise iOS-equivalent DAT Wi-Fi on Android without artifact and physical transport evidence."
  - id: version-dependency-page
    status: access-gated
    action: "Record the login result; never reconstruct exact compatibility values from memory or community reports."

generation_labels:
  - label: ray-ban-meta-gen-2
    status: source-plus-to-verify
    rule: "Use exact runtime identity, firmware, companion, artifact, and capability evidence."
  - label: ray-ban-meta-optics-gen-2
    status: source-plus-to-verify
    rule: "Do not inherit Display capability from the product label."
  - label: meta-ray-ban-display
    status: device-gated
    rule: "Use native Display or Web Apps only after capability and physical Display evidence."
  - label: meta-glasses
    status: to-verify-as-gen-3
    rule: "Do not equate the product line or enum signal with a Gen 3 runtime mapping."
  - label: gen-3
    status: to-verify
    rule: "Require current official mapping and named runtime evidence."
  - label: regular-sdk
    status: ambiguous
    rule: "Resolve to native DAT, native Display, Web Apps, or phone fallback; do not invent a third public SDK family."

evidence_ladder:
  - source
  - static
  - build
  - mock
  - browser-sim
  - connected
  - physical
  - signed
  - release-channel
  - production

refresh_triggers:
  - new DAT iOS tag, package, or generated API
  - new DAT Android artifact, Maven coordinate, or generated API
  - Web Apps toolkit/runtime or full-reference revision
  - authenticated Developer Center version/dependency or release policy change
  - Meta AI companion, on-glasses DAT-app, firmware, or device-model change
  - new official product/generation mapping
  - named target build, physical run, or compatibility failure
