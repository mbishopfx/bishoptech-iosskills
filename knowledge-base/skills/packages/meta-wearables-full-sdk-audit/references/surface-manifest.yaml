    - id: ios-core
      import_or_product: MWDATCore
      purpose: "configuration, registration, permissions, devices, selectors, sessions, state, and errors"
      status: confirmed-by-upstream-source
    - id: ios-camera
      import_or_product: MWDATCamera
      purpose: "Camera, Stream, VideoFrame, PhotoData, configuration, and capture"
      status: confirmed-by-upstream-source
    - id: ios-display
      import_or_product: MWDATDisplay
      purpose: "native Display content, components, input, icons/images, and video"
      status: confirmed-by-upstream-source
    - id: ios-mockdevice
      import_or_product: MWDATMockDevice
      purpose: "simulated glasses, permissions, media, gestures, and UI-test control"
      status: confirmed-by-upstream-source
